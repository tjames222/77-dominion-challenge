<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <script vite-ignore src="./theme-bootstrap.js" data-enable-dominion-night="false"></script>
    <title>Choose New Password | Dominion</title>
    <link rel="stylesheet" href="./src/assets/styles.css" />
    <link rel="stylesheet" href="./src/assets/product.css" />
    <link rel="stylesheet" href="./src/assets/dialog.css" />
    <link rel="stylesheet" href="./src/assets/menu.css" />
    <link rel="stylesheet" href="./src/assets/dominion-night.css" />
    <link rel="stylesheet" href="./src/assets/dominion-platinum.css" />
  </head>
  <body>
    <main class="app-shell auth-shell">
      <header class="topbar">
        <a class="back-link" href="./login.html">‹ Log in</a>
      </header>
      <section class="card auth-card" data-section-surface="accent">
        <p class="eyebrow">Account Security</p>
        <h1>Choose a new password</h1>
        <p class="lead">Use a unique passphrase with at least 12 characters.</p>
        <form id="passwordResetForm" aria-describedby="passwordResetFeedback">
          <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required disabled /></label>
          <label>Confirm new password<input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="12" required disabled /></label>
          <button class="primary" type="submit" disabled>Save new password</button>
        </form>
        <p class="profile-feedback" id="passwordResetFeedback" role="status" aria-live="polite">Verifying your reset link...</p>
        <div class="auth-complete" id="passwordResetComplete" hidden>
          <a class="primary" href="./login.html">Log in with your new password</a>
        </div>
        <p class="auth-note"><a href="./forgot-password.html">Request a new reset link</a></p>
      </section>
    </main>
    <script type="module" src="./src/static/menu.js"></script>
    <script type="module" src="./src/static/password-recovery.js"></script>
  </body>
</html>
