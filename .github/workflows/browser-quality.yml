name: Browser quality gate

# Temporary diagnostic branch only. Never merge into develop/main.
# This distinct job cannot satisfy the protected full-matrix check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-badge-lock-review:
    name: Review-only preview badge cross-tab lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      E2E_STRICT_THEME_BOOTSTRAP: ${{ vars.E2E_STRICT_THEME_BOOTSTRAP || 'false' }}
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install existing WebKit version
        run: pnpm exec playwright install --with-deps webkit
      - name: Verify one hundred exact-source first-attempt repetitions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const base = '02f5322d0d7557ec21648e7400d662043dc39716';
          const changed = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], { encoding: 'utf8' }).trim().split('\n');
          assert.deepEqual(changed, ['.github/workflows/browser-quality.yml'], 'Only this diagnostic workflow may differ from exact W02');
          const title = 'two tabs cannot claim the same unseen badge batch and an account switch cannot acknowledge it';
          const args = ['test', 'tests/e2e/deterministic-badges.spec.mjs', `--grep=${title}$`, '--project=webkit-badges-mobile', '--repeat-each=100', '--retries=0', '--workers=2', '--update-snapshots=none'];
          const cli = 'node_modules/@playwright/test/cli.js';
          const rows = report => {
            const tests = [];
            const visit = suite => {
              for (const spec of suite.specs || []) for (const test of spec.tests || []) tests.push({ title: spec.title, ...test });
              for (const child of suite.suites || []) visit(child);
            };
            visit(report);
            assert.deepEqual(report.errors, []);
            assert.equal(tests.length, 100);
            for (const test of tests) {
              assert.equal(test.title, title);
              assert.equal(test.projectId, 'webkit-badges-mobile');
            }
            return tests;
          };
          rows(JSON.parse(execFileSync(process.execPath, [cli, ...args, '--list', '--reporter=json'], { encoding: 'utf8' })));
          console.log(`Verified 100 unchanged WebKit badge claim cases from ${base}; retries=0, workers=2.`);
          const reportPath = 'test-results/preview-badge-lock-results.json';
          execFileSync(process.execPath, [cli, ...args, '--reporter=github,html,json'], {
            stdio: 'inherit',
            env: { ...process.env, PLAYWRIGHT_JSON_OUTPUT_NAME: reportPath },
          });
          for (const test of rows(JSON.parse(readFileSync(reportPath, 'utf8')))) {
            assert.equal(test.status, 'expected');
            assert.equal(test.expectedStatus, 'passed');
            assert.equal(test.results.length, 1, 'Every repetition must pass on its first and only attempt');
            assert.equal(test.results[0].status, 'passed');
          }
          NODE
      - name: Upload failure-only preview badge diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-badge-lock-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
