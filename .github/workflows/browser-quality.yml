name: Browser quality gate

# Temporary review branch only. Never merge this workflow into develop/main.
# This distinct job cannot satisfy the protected full-matrix check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workout-geometry-review:
    name: Review-only Workout geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      E2E_STRICT_THEME_BOOTSTRAP: ${{ vars.E2E_STRICT_THEME_BOOTSTRAP || 'false' }}
    steps:
      - name: Checkout exact review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install existing browser versions
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify ten strict repetitions against the unchanged baseline
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const baseline = 'tests/e2e/__snapshots__/visual-routes.spec.mjs/visual-desktop-dominion-night/workoutTwo.png';
          const expectedHash = '8d2b27fd988455fb7632d7f36d0b7c4e93f1dd95906936fd7a21ee8528d8f59a';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const before = readFileSync(baseline);
          assert.equal(digest(before), expectedHash, 'Require the original reviewed baseline');
          assert.equal(before.readUInt32BE(16), 1440);
          assert.equal(before.readUInt32BE(20), 1062);
          const args = ['test', 'tests/e2e/visual-routes.spec.mjs', '--grep=workoutTwo visual contract$', '--project=visual-desktop-dominion-night', '--repeat-each=10', '--update-snapshots=none'];
          const cli = 'node_modules/@playwright/test/cli.js';
          const rows = report => {
            const tests = [];
            const visit = suite => {
              for (const spec of suite.specs || []) for (const test of spec.tests || []) tests.push({ title: spec.title, ...test });
              for (const child of suite.suites || []) visit(child);
            };
            visit(report);
            assert.deepEqual(report.errors, []);
            assert.equal(tests.length, 10);
            for (const test of tests) {
              assert.equal(test.title, 'workoutTwo visual contract');
              assert.equal(test.projectId, 'visual-desktop-dominion-night');
            }
            return tests;
          };
          rows(JSON.parse(execFileSync(process.execPath, [cli, ...args, '--list', '--reporter=json'], { encoding: 'utf8' })));
          console.log('Verified exactly ten strict desktop Dominion Night Workout #2 repetitions.');
          const reportPath = 'test-results/workout-geometry-results.json';
          try {
            execFileSync(process.execPath, [cli, ...args, '--reporter=github,html,json'], {
              stdio: 'inherit',
              env: { ...process.env, PLAYWRIGHT_JSON_OUTPUT_NAME: reportPath },
            });
            for (const test of rows(JSON.parse(readFileSync(reportPath, 'utf8')))) {
              assert.equal(test.status, 'expected', 'A flaky retry is diagnostic failure, not stable geometry');
              assert.equal(test.expectedStatus, 'passed');
              assert.equal(test.results.length, 1, 'Require ten first-attempt passes');
              assert.equal(test.results[0].status, 'passed');
            }
          } finally {
            assert.equal(digest(readFileSync(baseline)), expectedHash, 'The strict probe must not update its baseline');
          }
          NODE
      - name: Upload failure-only geometry diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workout-geometry-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
