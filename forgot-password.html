<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <script vite-ignore src="./theme-bootstrap.js" data-enable-dominion-night="false"></script>
    <title>Reset Password | Dominion</title>
    <link rel="stylesheet" href="./src/assets/styles.css" />
    <link rel="stylesheet" href="./src/assets/product.css" />
    <link rel="stylesheet" href="./src/assets/dialog.css" />
    <link rel="stylesheet" href="./src/assets/menu.css" />
    <link rel="stylesheet" href="./src/assets/dominion-night.css" />
    <link rel="stylesheet" href="./src/assets/dominion-platinum.css" />
  </head>
  <body>
    <main class="app-shell auth-shell">
      <header class="topbar">
        <a class="back-link" href="./login.html">‹ Log in</a>
      </header>
      <section class="card auth-card" data-section-surface="accent">
        <p class="eyebrow">Password Help</p>
        <h1>Reset your password</h1>
        <p class="lead">Enter your account email. We will send a secure link if it matches an account.</p>
        <form id="passwordRecoveryRequestForm">
          <label>Email<input id="passwordRecoveryEmail" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <button class="primary" type="submit">Send reset link</button>
        </form>
        <p class="profile-feedback" id="passwordRecoveryRequestFeedback" role="status" aria-live="polite"></p>
        <p class="auth-note"><a href="./login.html">Return to login</a></p>
      </section>
    </main>
    <script type="module" src="./src/static/menu.js"></script>
    <script type="module" src="./src/static/password-recovery.js"></script>
  </body>
</html>
